[package]
name = "petrivet"
version = "0.1.0"
edition = "2024"
description = "A Rust library for working with Petri nets"
repository = "https://github.com/MichaelOwenDyer/petrivet"
keywords = ["petrinets", "modeling", "analysis"]

[dependencies]
ahash = "0.8.12"
good_lp = { version = "1.15.1", default-features = false, features = ["microlp"] }
petgraph = "0.8.3"
graph-cycles = "0.3.0"
quick-xml = { version = "0.40.1", features = ["serialize"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
tap = "1.0.1"

[features]
default = ["pnml"]
# A first-class `serde` feature: the certificate/verdict contract (the `model`
# module) is serde-ready by design (owned, borrow-free payloads — the external
# checker input and the training label). Today serde arrives only transitively
# via `pnml`; this makes it directly selectable so `model` can derive without
# pulling the whole PNML stack. See docs/foundations/foundational-design.md §F3″.
serde = ["dep:serde"]
pnml = ["serde", "quick-xml"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1.0.145"

[[bench]]
name = "analysis"
harness = false
