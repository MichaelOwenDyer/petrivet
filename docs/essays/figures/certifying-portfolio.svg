<svg viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>The certifying portfolio loop with its trust boundary: a learned policy schedules deciders, but only a checked certificate is accepted</title>
  <desc>A net flows through feature extraction to a learned policy that selects a decider to run. If the decider concludes, its certificate is checked; a passing check accepts the verdict, a failing or inconclusive result loops back to the policy. The policy, value estimate, and deciders sit in an untrusted region optimized for cost; only the certificate checker sits in the trusted base. A side panel maps the loop onto AlphaGo's policy, value, and search.</desc>

  <style>
    .ttl   { font-family: Georgia, serif; fill: #1a1a1a; }
    .lbl   { fill: #1a1a1a; }
    .sub   { fill: #555; }
    .reg   { fill: #666; letter-spacing: .1em; text-transform: uppercase; }
    .onAcc { fill: #ffffff; }
    .edge  { stroke: #b4b4b4; stroke-width: 1.6; fill: none; }
    .edgeL { fill: #555; }
    .map   { fill: #555; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <text x="32" y="40" class="ttl" font-size="24">The certifying portfolio</text>
  <text x="33" y="62" class="sub" font-size="13">A learned policy schedules; only a checked certificate is accepted. Soundness never touches the learner.</text>

  <rect x="28" y="86" width="600" height="416" rx="14" fill="none" stroke="#c98a3c" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="46" y="110" class="reg" font-size="11" fill="#b07a30">Untrusted · optimized for cost · learned</text>

  <rect x="52" y="132" width="120" height="56" rx="9" fill="#f1f2f1" stroke="#ddd"/>
  <text x="112" y="158" class="lbl" font-size="13" text-anchor="middle" font-weight="600">Net N</text>
  <text x="112" y="176" class="sub" font-size="10.5" text-anchor="middle">+ query, budget</text>

  <rect x="52" y="214" width="120" height="64" rx="9" fill="#f1f2f1" stroke="#ddd"/>
  <text x="112" y="240" class="lbl" font-size="12.5" text-anchor="middle" font-weight="600">φ(N)</text>
  <text x="112" y="258" class="sub" font-size="10" text-anchor="middle">class · SCC · invariants</text>
  <text x="112" y="271" class="sub" font-size="10" text-anchor="middle">autonomous macro-vars</text>

  <rect x="232" y="150" width="150" height="92" rx="10" fill="#c98a3c"/>
  <text x="307" y="178" class="onAcc" font-size="14" text-anchor="middle" font-weight="600">Policy  π(d | s)</text>
  <text x="307" y="198" class="onAcc" font-size="10.5" text-anchor="middle" opacity="0.92">picks next decider</text>
  <text x="307" y="212" class="onAcc" font-size="10.5" text-anchor="middle" opacity="0.92">— narrows breadth</text>
  <text x="307" y="231" class="onAcc" font-size="10" text-anchor="middle" opacity="0.82" font-style="italic">value V(s) prunes depth</text>

  <rect x="232" y="296" width="150" height="92" rx="10" fill="#eef0ef" stroke="#c98a3c" stroke-width="1.3"/>
  <text x="307" y="324" class="lbl" font-size="13.5" text-anchor="middle" font-weight="600">Run decider d</text>
  <text x="307" y="344" class="sub" font-size="10.5" text-anchor="middle">LP · ILP · CHC ·</text>
  <text x="307" y="358" class="sub" font-size="10.5" text-anchor="middle">Karp–Miller · …</text>
  <text x="307" y="377" class="sub" font-size="10" text-anchor="middle" font-style="italic">real rollout, not a sim</text>

  <text x="307" y="424" class="sub" font-size="10.5" text-anchor="middle">a lattice of partial deciders:</text>
  <text x="307" y="439" class="sub" font-size="10.5" text-anchor="middle">each sound on its domain</text>
  <text x="307" y="454" class="sub" font-size="10.5" text-anchor="middle">⟨ cost · polarity · admissibility ⟩</text>

  <path d="M474 342 L516 318 L558 342 L516 366 Z" fill="#eef0ef" stroke="#c98a3c" stroke-width="1.3"/>
  <text x="516" y="338" class="lbl" font-size="11" text-anchor="middle" font-weight="600">concluded?</text>
  <text x="516" y="351" class="sub" font-size="9.5" text-anchor="middle">cert or ⊥</text>

  <rect x="452" y="408" width="156" height="62" rx="9" fill="none" stroke="#c98a3c" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="530" y="432" class="sub" font-size="10.5" text-anchor="middle" font-weight="600">telemetry</text>
  <text x="530" y="448" class="sub" font-size="9.5" text-anchor="middle">⟨φ, d, accepted?, cost⟩</text>
  <text x="530" y="461" class="sub" font-size="9.5" text-anchor="middle" font-style="italic">certificate = the label</text>

  <rect x="660" y="232" width="250" height="150" rx="14" fill="#13624f" />
  <text x="676" y="218" class="reg" font-size="11" fill="#13624f">Trusted base · tiny · verifiable</text>
  <text x="785" y="270" class="onAcc" font-size="15" text-anchor="middle" font-weight="700" font-family="Georgia, serif">check(N, q, v, c)</text>
  <text x="785" y="294" class="onAcc" font-size="11" text-anchor="middle" opacity="0.92">the certificate trust boundary</text>
  <text x="785" y="318" class="onAcc" font-size="10.5" text-anchor="middle" opacity="0.85">accept ⟹ v is true</text>
  <text x="785" y="340" class="onAcc" font-size="10.5" text-anchor="middle" opacity="0.85">— independent of π</text>
  <text x="785" y="364" class="onAcc" font-size="9.5" text-anchor="middle" opacity="0.7" font-style="italic">replay seq · recompute m₀+Cσ · re-verify siphon</text>

  <rect x="700" y="430" width="170" height="58" rx="10" fill="#0f5246"/>
  <text x="785" y="455" class="onAcc" font-size="13" text-anchor="middle" font-weight="600">Proven(v, c)</text>
  <text x="785" y="473" class="onAcc" font-size="10" text-anchor="middle" opacity="0.85">sound verdict + witness</text>

  <line x1="112" y1="188" x2="112" y2="212" class="edge" marker-end="url(#a)"/>
  <path d="M172 246 C 200 246, 200 196, 230 196" class="edge" marker-end="url(#a)"/>
  <line x1="307" y1="242" x2="307" y2="294" class="edge" marker-end="url(#a)"/>
  <line x1="382" y1="342" x2="472" y2="342" class="edge" marker-end="url(#a)"/>
  <text x="427" y="334" class="edgeL" font-size="9.5" text-anchor="middle">emit</text>

  <path d="M558 342 L658 312" class="edge" marker-end="url(#a)"/>
  <text x="612" y="318" class="edgeL" font-size="9.5" text-anchor="middle">cert</text>

  <path d="M516 366 C 516 470, 360 486, 320 470 C 300 462, 303 250, 305 244" class="edge" marker-end="url(#a)"/>
  <text x="430" y="486" class="edgeL" font-size="9.5" text-anchor="middle">⊥ / reject → try another (record telemetry)</text>

  <path d="M382 372 C 420 388, 430 410, 450 424" class="edge" stroke-dasharray="3 3" marker-end="url(#a)"/>

  <path d="M785 382 L785 428" class="edge" marker-end="url(#a)"/>
  <text x="806" y="408" class="edgeL" font-size="9.5">accept</text>
  <path d="M700 358 C 600 392, 600 250, 384 214" class="edge" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="556" y="250" class="edgeL" font-size="9.5" text-anchor="middle">reject → loop</text>

  <line x1="32" y1="528" x2="908" y2="528" stroke="#e0e0e0" stroke-width="1"/>
  <text x="32" y="552" class="reg" font-size="10.5">AlphaGo map</text>
  <text x="140" y="552" class="map" font-size="11.5">policy net → π (which decider)</text>
  <text x="372" y="552" class="map" font-size="11.5">value net → V (cost-to-proof)</text>
  <text x="590" y="552" class="map" font-size="11.5">MCTS → the loop</text>
  <text x="740" y="552" class="map" font-size="11.5" font-weight="600" fill="#13624f">leaves → verified, not estimated</text>
  <text x="32" y="578" class="sub" font-size="11" font-style="italic">The difference from Go: every leaf is a proof. A wrong policy costs time, never correctness — so the learner trains cheap, self-supervised, and stays outside trust.</text>
</svg>
