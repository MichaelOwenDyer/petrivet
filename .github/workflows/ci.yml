name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Runs the flake's checks: the test suite (including doctests) and compiling the benchmarks.
      - name: Run checks
        run: nix flake check -L
